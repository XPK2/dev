services:
  postgres:
    image: postgres:16
    container_name: couple-postgres
    environment:
      POSTGRES_DB: couple_db
      POSTGRES_USER: couple_user
      POSTGRES_PASSWORD: couple_password
    ports:
      - "5432:5432"
    volumes:
      - couple_pg_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: couple-redis
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - couple_redis_data:/data

volumes:
  couple_pg_data:
  couple_redis_data:

