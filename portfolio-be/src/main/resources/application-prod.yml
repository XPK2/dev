# application-prod.yml — Production config for Render.com + Neon Tech
# All secrets are read from Environment Variables set on Render dashboard

spring:
  application:
    name: couple-backend

  datasource:
    # Neon Tech provides DATABASE_URL as:
    #   postgresql://user:pass@ep-xxx.us-east-2.aws.neon.tech/neondb?sslmode=require
    # Spring requires the jdbc: prefix — set JDBC_DATABASE_URL on Render instead:
    #   jdbc:postgresql://user:pass@ep-xxx.../neondb?sslmode=require
    # OR set DATABASE_URL and use the jdbc-url workaround below.
    # RECOMMENDED: on Render dashboard set env var name = JDBC_DATABASE_URL
    url: ${JDBC_DATABASE_URL:${DATABASE_URL}}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 3          # Neon free tier connection limit
      minimum-idle: 1
      connection-timeout: 20000
      idle-timeout: 300000
      max-lifetime: 1200000
      connection-test-query: SELECT 1

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc:
          batch_size: 20
        order_inserts: true
        order_updates: true
    open-in-view: false

  flyway:
    enabled: true
    baselineOnMigrate: true
    baseline-version: 0
    locations: classpath:db/migration
    outOfOrder: false
    cleanDisabled: true
    validateOnMigrate: false

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

server:
  port: ${PORT:10000}
  servlet:
    context-path: /
  tomcat:
    max-http-form-post-size: 10485760
  compression:
    enabled: false

jwt:
  secret: ${JWT_SECRET}
  expiration: 86400000

management:
  endpoints:
    web:
      exposure:
        include: health
      base-path: /actuator
  endpoint:
    health:
      show-details: never

logging:
  level:
    root: WARN
    com.couple.backend: INFO
  pattern:
    console: "%d{HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
