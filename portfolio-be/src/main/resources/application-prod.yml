# application-prod.yml — Production config for Render.com + Neon Tech
# Neon connection: postgresql://neondb_owner:***@ep-twilight-flower-a1hfny0w-pooler.ap-southeast-1.aws.neon.tech/neondb

spring:
  application:
    name: couple-backend

  main:
    lazy-initialization: true

  datasource:
    url: ${DB_URL:jdbc:postgresql://ep-twilight-flower-a1hfny0w-pooler.ap-southeast-1.aws.neon.tech/neondb?sslmode=require&channel_binding=disable}
    username: ${DB_USERNAME:neondb_owner}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 3
      minimum-idle: 1
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      connection-test-query: SELECT 1

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc:
          lob:
            non_contextual_creation: true
    open-in-view: false

  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 0
    locations: classpath:db/migration
    out-of-order: false
    clean-disabled: true
    validate-on-migrate: false

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  cache:
    type: redis
    redis:
      time-to-live: 300000

  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 10MB

server:
  port: ${PORT:10000}
  tomcat:
    max-http-form-post-size: 10485760

jwt:
  secret: ${JWT_SECRET}
  expiration: 86400000

cors:
  allowed-origins: ${ALLOWED_ORIGINS:https://localhost:5173,https://www.thuha.io.vn,https://thuha.io.vn}

management:
  endpoints:
    web:
      exposure:
        include: health
      base-path: /actuator
  endpoint:
    health:
      show-details: never

logging:
  level:
    root: WARN
    com.couple.backend: INFO
    org.flywaydb: INFO
  pattern:
    console: "%d{HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
